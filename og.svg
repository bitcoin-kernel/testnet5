<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#243328" flood-opacity="0.10"/>
    </filter>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d2e5d1" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#f7f8f3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- warm paper, a soft green glow top right -->
  <rect width="1200" height="630" fill="#f7f8f3"/>
  <circle cx="1060" cy="70" r="380" fill="url(#glow)"/>
  <rect width="1200" height="8" fill="#ed7c2c"/>

  <!-- brand + eyebrow -->
  <text x="80" y="94" font-size="30" font-weight="700" fill="#17211b" letter-spacing="-1">bitcoin<tspan fill="#ed7c2c">·</tspan>kernel</text>
  <text x="80" y="150" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="700" fill="#b95216" letter-spacing="3">TESTNET5 · BIP95 · BIP54</text>

  <!-- headline -->
  <text x="76" y="246" font-size="56" font-weight="700" fill="#17211b" letter-spacing="-2.4">Testnet5,</text>
  <text x="76" y="312" font-size="56" font-weight="700" fill="#17211b" letter-spacing="-2.4">validated in <tspan fill="#c2590f">your tab.</tspan></text>
  <path d="M 446 328 C 520 322 620 322 716 326" fill="none" stroke="#ed7c2c" stroke-width="4" stroke-linecap="round" opacity="0.65"/>

  <!-- supporting lines -->
  <text x="80" y="402" font-size="23" fill="#5d685f">Every block since genesis, checked in the browser:</text>
  <text x="80" y="434" font-size="23" fill="#5d685f">no snapshot, no trusted server, tip signed on Nostr.</text>

  <!-- what it checks, as chips -->
  <g font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="700">
    <rect x="80" y="486" width="188" height="44" rx="22" fill="#ffffff" stroke="#dde3da"/>
    <text x="174" y="514" text-anchor="middle" fill="#17211b">proof of work</text>
    <rect x="282" y="486" width="110" height="44" rx="22" fill="#ffffff" stroke="#dde3da"/>
    <text x="337" y="514" text-anchor="middle" fill="#17211b">scripts</text>
    <rect x="406" y="486" width="98" height="44" rx="22" fill="#fff0e3" stroke="#ed7c2c"/>
    <text x="455" y="514" text-anchor="middle" fill="#b95216">BIP54</text>
    <rect x="518" y="486" width="164" height="44" rx="22" fill="#ffffff" stroke="#dde3da"/>
    <text x="600" y="514" text-anchor="middle" fill="#17211b">every coin</text>
  </g>
  <text x="80" y="582" font-family="DejaVu Sans Mono, monospace" font-size="19" fill="#5d685f">bitcoin-kernel.com/testnet5</text>

  <!-- node card -->
  <g filter="url(#soft)">
    <rect x="830" y="168" width="290" height="372" rx="26" fill="#fffdf8" stroke="#ced7cb"/>
  </g>
  <circle cx="862" cy="208" r="6" fill="#2f7a45"/>
  <circle cx="862" cy="208" r="11" fill="#2f7a45" opacity="0.15"/>
  <text x="880" y="214" font-family="DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#566156" letter-spacing="1.5">NODE · IN SYNC</text>
  <line x1="830" y1="236" x2="1120" y2="236" stroke="#e6ebe2"/>

  <text x="858" y="282" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="700" fill="#5d685f" letter-spacing="1.5">BLOCKS VALIDATED</text>
  <text x="858" y="328" font-size="44" font-weight="700" fill="#17211b" letter-spacing="-1.5">4,210</text>

  <text x="858" y="378" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="700" fill="#5d685f" letter-spacing="1.5">UNSPENT COINS</text>
  <text x="858" y="420" font-size="36" font-weight="700" fill="#17211b" letter-spacing="-1">13,630</text>

  <text x="858" y="468" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="700" fill="#5d685f" letter-spacing="1.5">MATCHES CORE</text>
  <text x="858" y="508" font-size="27" font-weight="700" fill="#2f7a45">✓ coin for coin</text>
</svg>
